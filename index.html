<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0"/>
    <title>“閒”是生活的標點 - 倒计时</title>
    
    <!-- 多CDN资源加载策略 -->
    <link rel="stylesheet" 
          href="https://cdn.staticfile.org/materialize/1.0.0/css/materialize.min.css"
          onerror="loadFallback(this)">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/flipclock/0.10.8/flipclock.min.css"
          onerror="loadFallback(this)">
    <link href="https://fonts.loli.net/icon?family=Material+Icons" rel="stylesheet">
    <link rel="icon" href="https://fastly.jsdelivr.net/gh/iTaoPu/iTaoPu.GitHub.io@main/List/Jing.png"/>
    
    <!-- 视觉优化 -->
    <style>
        :root {
            --primary-color: #e53935;
            --secondary-color: #616161;
        }

        .flip-clock-wrapper {
            margin: 2rem auto;
            transform: scale(1.2);
            --fc-color: var(--primary-color);
            --fc-divider-color: var(--secondary-color);
        }

        .flip-clock-card {
            background: linear-gradient(145deg, #ffffff 30%, #f8f9fa 100%);
            border-radius: 10px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.12);
        }

        .inn {
            text-shadow: 0 2px 3px rgba(0,0,0,0.15);
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        @media (max-width: 768px) {
            .flip-clock-wrapper {
                transform: scale(0.85);
                margin: 1rem auto;
            }
            h1.header { font-size: 2.5rem; }
        }

        @media (max-width: 480px) {
            .flip-clock-wrapper { transform: scale(0.7); }
        }
    </style>
</head>
<body class="grey lighten-4">
    <!-- 导航栏 -->
    <nav class="grey darken-3">
        <div class="nav-wrapper container">
            <a href="#" class="brand-logo">閒時光</a>
            <a href="#" data-target="nav-mobile" class="sidenav-trigger">
                <i class="material-icons">menu</i>
            </a>
            <ul class="right hide-on-med-and-down">
                <li class="active"><a href="/"><i class="material-icons left">home</i>主页</a></li>
                <li><a href="https://adrules.5iclub.cloudns.biz" target="_blank">
                    <i class="material-icons left">ad_units</i>广告规则
                </a></li>
                <li><a href="https://status.5iclub.cloudns.biz" target="_blank">
                    <i class="material-icons left">monitor_heart</i>服务状态
                </a></li>
            </ul>
        </div>
    </ul>

    <!-- 主内容 -->
    <main class="container">
        <div class="section">
            <h1 class="header center red-text text-darken-2">“閒”是生活的標點</h1>
            <div class="row">
                <div class="col s12">
                    <div class="clock card-panel hoverable z-depth-3"></div>
                    <div class="message-container"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="page-footer grey darken-3">
        <div class="container">
            <!-- 页脚内容保持原样 -->
        </div>
    </footer>

    <!-- 多源脚本加载 -->
    <script>
        // CDN 容错处理
        function loadFallback(link) {
            const cdnMap = {
                'materialize.min.css': 'https://fastly.jsdelivr.net/npm/materialize-css@1.0.0/dist/css/materialize.min.css',
                'flipclock.min.css': 'https://fastly.jsdelivr.net/npm/flipclock@0.10.8/flipclock.min.css'
            };
            link.href = cdnMap[link.href.split('/').pop()] || link.href;
        }
    </script>
    
    <!-- 主逻辑 -->
    <script src="https://cdn.staticfile.org/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdn.staticfile.org/materialize/1.0.0/js/materialize.min.js"></script>
    <script src="https://cdn.staticfile.org/flipclock/0.10.8/flipclock.min.js"></script>
    <script>
        $(document).ready(function() {
            // 时区安全处理
            const getBeijingTime = () => {
                const now = new Date();
                return new Date(now.toLocaleString("en-US", { 
                    timeZone: "Asia/Shanghai",
                    hour12: false
                }));
            };

            // 目标时间 (UTC时间对应北京时间2026-01-01 00:00:00)
            const targetDate = new Date(Date.UTC(2025, 11, 31, 16, 0, 0));
            let clockInstance;

            // 初始化倒计时
            const initClock = (diffSeconds) => {
                clockInstance = new FlipClock($('.clock'), diffSeconds, {
                    clockFace: 'DailyCounter',
                    countdown: true,
                    autoStart: true,
                    showSeconds: true,
                    language: 'chinese',
                    classes: {
                        active: 'fc-active',
                        divider: 'fc-divider',
                        label: 'fc-label'
                    },
                    callbacks: {
                        interval: () => {
                            const current = getBeijingTime();
                            if (current >= targetDate) {
                                clockInstance.stop();
                                showCompletion();
                            }
                        }
                    }
                });
            };

            // 显示完成状态
            const showCompletion = () => {
                $('.message-container').html(`
                    <div class="card-panel teal darken-2 white-text">
                        <h4>新纪元已开启!</h4>
                        <p>倒计时圆满结束</p>
                    </div>
                `);
            };

            // 时间同步逻辑
            const syncTimer = () => {
                const current = getBeijingTime();
                const diff = Math.floor((targetDate - current) / 1000);

                if (diff <= 0) {
                    if (clockInstance) clockInstance.stop();
                    return;
                }

                if (!clockInstance) {
                    initClock(diff);
                } else {
                    clockInstance.setValue(diff);
                }
            };

            // 初始化组件
            M.AutoInit();
            syncTimer();
            setInterval(syncTimer, 987);
        });
    </script>
</body>
</html>
