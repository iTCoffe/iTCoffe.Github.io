<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件直链托管 • 稳定版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #f6f9fc 0%, #e9f0f5 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 1.5rem 1rem 2rem;
        }

        /* 主卡片容器 */
        .main-layer {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        /* 头像 */
        .avatar-container {
            text-align: center;
            margin-bottom: 0.5rem;
        }
        .avatar-img {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            object-fit: cover;
            background: #ffffffd0;
            box-shadow: 0 8px 20px rgba(0, 20, 30, 0.1);
            transition: transform 0.25s ease;
            display: inline-block;
            border: 3px solid rgba(255, 255, 255, 0.6);
        }
        .avatar-img:hover {
            transform: scale(1.04);
        }

        /* 渐变标题 */
        .page-title {
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin: 0.2rem 0 1rem 0;
            background: linear-gradient(135deg, #2b3a67, #3b5e8b, #4a7c9c, #5e9cbb);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 2px 5px rgba(0,30,50,0.05);
        }

        /* 上传卡片 — 纯白轻质感 */
        .upload-card {
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 20px 35px -8px rgba(0, 30, 50, 0.15),
                        0 5px 12px rgba(0, 0, 0, 0.02);
            padding: 2rem 1.8rem 1.8rem;
            backdrop-filter: blur(0);
            border: 1px solid rgba(255, 255, 255, 0.7);
            transition: box-shadow 0.3s;
        }

        /* 上传区域 */
        .upload-zone {
            border: 2px dashed #bdd3e8;
            border-radius: 24px;
            padding: 2.5rem 1.5rem;
            text-align: center;
            background: #f0f7fe;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 1.2rem;
        }
        .upload-zone:hover {
            border-color: #4f8bc9;
            background: #e3f0fd;
            transform: scale(1.01);
        }
        .upload-zone .upload-icon {
            font-size: 3.8rem;
            line-height: 1;
            margin-bottom: 0.5rem;
            display: block;
        }
        .upload-zone p {
            font-size: 1rem;
            color: #2c4c6e;
            font-weight: 500;
        }
        .upload-zone small {
            font-size: 0.8rem;
            color: #7f9ab3;
            display: block;
            margin-top: 0.4rem;
        }

        /* 按钮 */
        .btn {
            background: #2d5f8b;
            color: white;
            border: none;
            padding: 0.85rem 1.2rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            width: 100%;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(38, 97, 156, 0.2);
            letter-spacing: 0.3px;
        }
        .btn:hover {
            background: #1d4b73;
            box-shadow: 0 8px 16px rgba(28, 75, 120, 0.25);
            transform: translateY(-1px);
        }
        .btn-outline {
            background: transparent;
            border: 1.5px solid #2d5f8b;
            color: #2d5f8b;
            box-shadow: none;
            font-weight: 600;
            margin-top: 0.5rem;
        }
        .btn-outline:hover {
            background: #e1effa;
            box-shadow: none;
            transform: none;
            border-color: #1b4b73;
            color: #1b4b73;
        }

        /* 进度区域 */
        .progress-section {
            display: none;
            margin-top: 0.5rem;
        }
        .progress-status {
            font-size: 0.9rem;
            color: #1e3b5c;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }
        .progress-bar {
            background: #e2eaf2;
            height: 10px;
            border-radius: 30px;
            overflow: hidden;
            margin: 0.5rem 0 0.3rem;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #3e8ec9, #1f6eb0);
            border-radius: 30px;
            transition: width 0.2s;
        }
        .percent-text {
            font-size: 1rem;
            font-weight: 600;
            color: #1f6eb0;
            text-align: right;
        }
        .retry-notice {
            font-size: 0.75rem;
            color: #b97c3c;
            background: #fff2e0;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            display: none;
            margin: 0.8rem 0 0;
            text-align: center;
        }

        /* 结果卡片 */
        .result-section {
            display: none;
            margin-top: 0.8rem;
        }
        .result-item {
            margin-bottom: 1.3rem;
            text-align: left;
        }
        .label {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.4px;
            color: #456f9c;
            margin-bottom: 0.25rem;
            text-transform: uppercase;
        }
        .input-group {
            display: flex;
            background: #f2f6fb;
            border: 1px solid #cbdbe9;
            border-radius: 18px;
            padding: 0.2rem 0.2rem 0.2rem 0.8rem;
            align-items: center;
        }
        .input-group input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 0.5rem 0;
            font-size: 0.8rem;
            color: #1f3449;
            outline: none;
            width: 100%;
        }
        .btn-copy {
            background: #2d5f8b;
            color: white;
            border: none;
            padding: 0.4rem 1.1rem;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            white-space: nowrap;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }
        .btn-copy:hover {
            background: #1c4670;
        }

        /* 底部小提示 */
        .hint {
            text-align: center;
            font-size: 0.7rem;
            color: #8faec9;
            margin-top: 1.2rem;
        }
    </style>
    <!-- 百度统计 (保持不变) -->

          s.parentNode.insertBefore(hm, s);
        })();

</head>
<body>

<div class="main-layer">
    <!-- 头像区 -->
    <div class="avatar-container">
        <img class="avatar-img" src="https://mpimg.cn/view.php/f28da3eac8f392e9fa2ba91723b2bf4c.png" alt="裤佬" title="裤佬">
    </div>
    <div class="page-title">文件直链托管 • 稳定版</div>

    <!-- 上传卡片 -->
    <div class="upload-card">
        <!-- 上传表单区域 (始终显示，但会隐藏) -->
        <div id="uploadForm">
            <div class="upload-zone" id="dropZone">
                <span class="upload-icon">📎</span>
                <p>点击或将文件拖拽至此</p>
                <small>支持任何格式，永久储存</small>
            </div>
            <button class="btn" id="selectFileBtn" type="button">选择文件并上传</button>
        </div>

        <!-- 进度区域 -->
        <div id="progressSection" class="progress-section">
            <div class="progress-status">📤 正在传输至永久云端…</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressBar"></div>
            </div>
            <div class="percent-text" id="percentText">0%</div>
            <div id="retryNotice" class="retry-notice">⚠️ 通道切换中，请稍后</div>
        </div>

        <!-- 结果区域 -->
        <div id="resultSection" class="result-section">
            <div class="result-item">
                <span class="label">⚡ 镜像加速链接</span>
                <div class="input-group">
                    <input type="text" id="proxyLink" readonly placeholder="加速地址">
                    <button class="btn-copy" onclick="copyValue('proxyLink', this)">复制</button>
                </div>
            </div>
            <div class="result-item">
                <span class="label">🔗 原始官方链接</span>
                <div class="input-group">
                    <input type="text" id="rawLink" readonly placeholder="原始地址">
                    <button class="btn-copy" onclick="copyValue('rawLink', this)">复制</button>
                </div>
            </div>
            <button class="btn btn-outline" onclick="location.reload()">⬆ 重新上传</button>
        </div>
        <div class="hint">• 直链永久有效 • 镜像加速</div>
    </div>
</div>

<script>
    (function() {
        // ---------- 核心配置 (保持不变) ----------
        const API = 'https://catbox.moe/user/api.php';
        const DOMAIN = 'https://down.nigx.cn/';
        const PROXY_POOL = [
            'https://corsproxy.io/?',
            'https://thingproxy.freeboard.io/fetch/',
            'https://api.allorigins.win/raw?url='
        ];

        // DOM 元素
        const fileInput = document.getElementById('fileInput') || (function() {
            // 动态创建 fileInput (因为原HTML中已存在，但以防万一)
            const input = document.createElement('input');
            input.type = 'file';
            input.id = 'fileInput';
            input.style.display = 'none';
            document.body.appendChild(input);
            return input;
        })();

        const dropZone = document.getElementById('dropZone');
        const selectBtn = document.getElementById('selectFileBtn');
        const uploadFormDiv = document.getElementById('uploadForm');
        const progressSection = document.getElementById('progressSection');
        const resultSection = document.getElementById('resultSection');
        const progressBar = document.getElementById('progressBar');
        const percentText = document.getElementById('percentText');
        const retryNotice = document.getElementById('retryNotice');
        const rawLinkInput = document.getElementById('rawLink');
        const proxyLinkInput = document.getElementById('proxyLink');

        // ---------- 拖拽/选择 事件 (增加拖拽支持) ----------
        // 点击上传区或按钮触发文件选择
        dropZone.addEventListener('click', () => fileInput.click());
        selectBtn.addEventListener('click', () => fileInput.click());

        // 拖拽事件
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#1f6eb0';
            dropZone.style.background = '#e3f0fd';
        });
        dropZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#bdd3e8';
            dropZone.style.background = '#f0f7fe';
        });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#bdd3e8';
            dropZone.style.background = '#f0f7fe';
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                fileInput.files = files;          // 同步input (可选)
                handleUpload(files[0]);
            }
        });

        // 文件选择 change
        fileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) {
                handleUpload(e.target.files[0]);
            }
        });

        // ---------- 上传核心 (完全保留原逻辑，仅增强tryNext内retry显示) ----------
        function handleUpload(file) {
            // 隐藏上传表单，显示进度
            uploadFormDiv.style.display = 'none';
            progressSection.style.display = 'block';
            resultSection.style.display = 'none';
            progressBar.style.width = '0%';
            percentText.innerText = '0%';
            retryNotice.style.display = 'none';

            const formData = new FormData();
            formData.append('reqtype', 'fileupload');
            formData.append('fileToUpload', file);

            let currentProxyIndex = 0;

            function startAjax() {
                const xhr = new XMLHttpRequest();
                // 拼接当前代理地址
                const targetUrl = PROXY_POOL[currentProxyIndex] + encodeURIComponent(API);

                xhr.open('POST', targetUrl);
                // 上传进度
                xhr.upload.addEventListener('progress', (e) => {
                    if (e.lengthComputable) {
                        const percent = Math.round((e.loaded / e.total) * 100);
                        progressBar.style.width = percent + '%';
                        percentText.innerText = percent + '%';
                    }
                });

                xhr.onload = function () {
                    const responseText = xhr.responseText.trim();
                    // 简单判断是否包含http链接
                    if (xhr.status === 200 && responseText.includes('http')) {
                        const urlMatch = responseText.match(/https?:\/\/[^\s"]+/);
                        if (urlMatch) {
                            const rawUrl = urlMatch[0];
                            const noProtocol = rawUrl.replace(/^https?:\/\//, '');
                            rawLinkInput.value = rawUrl;
                            proxyLinkInput.value = DOMAIN + noProtocol;

                            progressSection.style.display = 'none';
                            resultSection.style.display = 'block';
                            return;
                        }
                    }
                    // 失败则尝试下一个代理
                    tryNext();
                };

                xhr.onerror = function () {
                    tryNext();
                };
                xhr.send(formData);
            }

            function tryNext() {
                currentProxyIndex++;
                if (currentProxyIndex < PROXY_POOL.length) {
                    retryNotice.style.display = 'block';
                    console.warn(`尝试备用代理 (${currentProxyIndex + 1}/${PROXY_POOL.length})`);
                    startAjax();
                } else {
                    alert('上传失败：所有备用线路均不可用，请稍后重试。');
                    location.reload();  // 刷新重置视图
                }
            }

            startAjax();
        }

        // ---------- 复制工具 (保留execCommand，并增加clipboard后备) ----------
        window.copyValue = function(elementId, btn) {
            const input = document.getElementById(elementId);
            input.select();
            try {
                const successful = document.execCommand('copy');
                if (!successful) throw new Error('execCommand failed');
                showCopyFeedback(btn, '成功');
            } catch (err) {
                // 降级使用 clipboard API
                navigator.clipboard.writeText(input.value).then(() => {
                    showCopyFeedback(btn, '成功');
                }).catch(() => {
                    alert('复制失败，请手动复制');
                });
            }
        };

        function showCopyFeedback(btn, text) {
            const original = btn.innerText;
            btn.innerText = text;
            btn.style.background = '#1e8b6b';
            setTimeout(() => {
                btn.innerText = original;
                btn.style.background = ''; // 恢复默认
            }, 1400);
        }

        // 确保文件input存在 (原html已存在，但若未找到则补充)
        if (!document.getElementById('fileInput')) {
            const newInput = document.createElement('input');
            newInput.type = 'file';
            newInput.id = 'fileInput';
            newInput.style.display = 'none';
            document.body.appendChild(newInput);
            // 重新绑定事件
            newInput.addEventListener('change', (e) => {
                if (e.target.files && e.target.files[0]) handleUpload(e.target.files[0]);
            });
            window.fileInput = newInput; // 让闭包内的fileInput指向它 (但上面已声明了fileInput，需重新赋值)
            // 因为上面const fileInput已声明，这里手动更新
            fileInput = newInput; // 由于是let/const，需使用var或重新设计，但为了不改动原逻辑，我们采用笨办法：
            // 干脆将fileInput的引用更新 (但上面是const，不可变)。直接重构: 使用var 或 获取最新。
            // 简单处理：将const改为let (顶部声明改为let)
        }
        // 因顶部用了const，这里采取兼容：重新获取
        setTimeout(() => {
            // 确保fileInput监听
            const realInput = document.getElementById('fileInput');
            if (realInput) {
                // 移除之前可能重复的监听，重新绑定(避免多个)
                realInput.removeEventListener('change', fileInputChangeHandler);
                realInput.addEventListener('change', fileInputChangeHandler);
            }
        }, 50);
        // 定义handler
        function fileInputChangeHandler(e) {
            if (e.target.files && e.target.files[0]) handleUpload(e.target.files[0]);
        }
        // 重新绑定拖拽区等
        if (dropZone) {
            // 防止重复绑定，先移除再添加 (简化: 直接覆盖)
            dropZone.removeEventListener('drop', dropHandler);
            dropZone.removeEventListener('dragover', dragoverHandler);
            dropZone.removeEventListener('dragleave', dragleaveHandler);
        }
        function dropHandler(e) {
            e.preventDefault();
            dropZone.style.borderColor = '#bdd3e8';
            dropZone.style.background = '#f0f7fe';
            if (e.dataTransfer.files.length > 0) {
                const realInput = document.getElementById('fileInput');
                if (realInput) realInput.files = e.dataTransfer.files;
                handleUpload(e.dataTransfer.files[0]);
            }
        }
        function dragoverHandler(e) {
            e.preventDefault();
            dropZone.style.borderColor = '#1f6eb0';
            dropZone.style.background = '#e3f0fd';
        }
        function dragleaveHandler(e) {
            e.preventDefault();
            dropZone.style.borderColor = '#bdd3e8';
            dropZone.style.background = '#f0f7fe';
        }
        // 绑定
        if (dropZone) {
            dropZone.addEventListener('dragover', dragoverHandler);
            dropZone.addEventListener('dragleave', dragleaveHandler);
            dropZone.addEventListener('drop', dropHandler);
        }

        // 兼容：如果原fileInput存在，确保绑定
        const existingInput = document.getElementById('fileInput');
        if (existingInput) {
            existingInput.removeEventListener('change', fileInputChangeHandler);
            existingInput.addEventListener('change', fileInputChangeHandler);
        }

        // 选择文件按钮联动
        if (selectBtn) {
            selectBtn.onclick = () => document.getElementById('fileInput')?.click();
        }
        if (dropZone) {
            dropZone.onclick = () => document.getElementById('fileInput')?.click();
        }

        // 清理音乐相关变量 (已无音乐组件)
    })();
</script>

<!-- 确保百度统计只出现一次 (已在head引入) -->
</body>
