name: 更新 Telegram 代理列表

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'

jobs:
  update-proxies:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: 提取并替换代理链接
        env:
          TARGET_FILE: TGProxy.html
          REMOTE_RAW_URL: https://raw.githubusercontent.com/Jsnzkpg/TelegramProxy/refs/heads/Jsnzkpg/index.html
        run: |
          cat > update.mjs << 'EOF'
          import fs from 'fs';
          const TARGET_FILE = process.env.TARGET_FILE;
          const REMOTE_URL = process.env.REMOTE_RAW_URL;
          const remoteRes = await fetch(REMOTE_URL);
          if (!remoteRes.ok) throw new Error(`HTTP ${remoteRes.status}`);
          const remoteHtml = await remoteRes.text();
          const arrayRegex = /const\s+proxies\s*=\s*(\[[\s\S]*?\]);/;
          const match = remoteHtml.match(arrayRegex);
          if (!match) throw new Error('未找到 proxies 数组');
          const remoteProxies = eval('(' + match[1] + ')');
          let localHtml = fs.readFileSync(TARGET_FILE, 'utf-8');
          const localMatch = localHtml.match(arrayRegex);
          if (!localMatch) throw new Error('本地未找到 proxies 数组');
          const oldArrayStr = localMatch[1];
          const lines = oldArrayStr.split('\n');
          let indent = '            ';
          for (const line of lines) {
            if (line.trim().startsWith('"tg://')) {
              const spaces = line.match(/^\s*/)[0];
              if (spaces.length > 0) indent = spaces;
              break;
            }
          }
          const newArrayItems = remoteProxies.map(url => `${indent}"${url}",`).join('\n');
          const finalArrayStr = `[\n${newArrayItems.replace(/,\s*$/, '')}\n${indent.slice(0, -4)}]`;
          const newLocalHtml = localHtml.replace(arrayRegex, `const proxies = ${finalArrayStr};`);
          if (newLocalHtml !== localHtml) {
            fs.writeFileSync(TARGET_FILE, newLocalHtml);
            fs.writeFileSync('summary.txt', `更新代理列表至 ${new Date().toISOString()}\n新代理数量: ${remoteProxies.length}`);
          }
          EOF
          node update.mjs

      - name: 提交更改
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add TGProxy.html
          git diff --staged --quiet || git commit -F summary.txt && git push
